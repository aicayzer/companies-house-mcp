name: CI

on:
  pull_request:
  push:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # The Worker build runs `wrangler deploy --dry-run`, which needs no
  # Cloudflare credentials. Telemetry is off so CI stays quiet.
  WRANGLER_SEND_METRICS: false

jobs:
  quality:
    name: Code Quality & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version:` here on purpose. package.json's `packageManager` field
        # pins the exact version, and action-setup errors out if both are set.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # Build before type checking. The Worker imports the CLI through its
      # published subpath exports, so it type checks against the CLI's emitted
      # declarations rather than its source — which means those declarations
      # have to exist. Checking against them is the point: it is what catches a
      # broken export map.
      - name: Build
        run: pnpm build

      - name: TypeScript check
        run: pnpm typecheck

      - name: Build documentation
        run: pnpm docs:build

      - name: Test packaged stdio entry points
        run: pnpm test:package

      - name: Run unit tests
        run: pnpm test:unit

      - name: Run integration tests
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        run: pnpm test:integration
        env:
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true
