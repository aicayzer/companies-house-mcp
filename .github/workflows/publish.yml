name: Publish to npm

on:
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        # No `version:` here on purpose. package.json's `packageManager` field
        # pins the exact version, and action-setup errors out if both are set.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linting
        run: pnpm lint

      - name: TypeScript check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test packaged stdio entry points
        run: pnpm test:package

      - name: Run unit tests
        run: pnpm test:unit

      - name: Build documentation
        run: pnpm docs:build

      - name: Publish companies-house-cli
        run: pnpm publish --provenance --access public --no-git-checks
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ''

      - name: Publish companies-house-mcp
        run: pnpm publish --provenance --access public --no-git-checks
        working-directory: packages/mcp
        env:
          NODE_AUTH_TOKEN: ''
